<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <title>Connection unavailable</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: #080808; color: #fff;
      font-family: system-ui, sans-serif; text-align: center;
    }
    main { max-width: 440px; }
    h1 { color: #d6b35a; }
    p { color: #ccc; line-height: 1.6; }
    a {
      display: inline-block; margin-top: 14px; padding: 12px 20px;
      border-radius: 9px; background: #d6b35a; color: #080808;
      font-weight: 700; text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>We've still got your back</h1>
    <h2>Your connection is unavailable</h2>
    <p>
      You can return to your saved shopping space if it has already been
      opened on this device. Previously saved catalogue information may be
      available there.
    </p>
    <a href="/">Return to saved shopping</a>
  </main>
</body>
</html>
